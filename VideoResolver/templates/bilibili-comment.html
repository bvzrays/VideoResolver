<!DOCTYPE html>
<html class="{{theme_class}}">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #18191c;
            --border-color: #e3e8ec;
            --item-border-color: #f1f2f3;
            --reply-bg: #f1f2f3;
            --username-color: #61666d;
            --meta-color: #9499a0;
        }
        html.dark {
            --bg-color: #18191c;
            --text-color: #f1f1f1;
            --border-color: #2f303c;
            --item-border-color: #2f303c;
            --reply-bg: #21232c;
            --username-color: #9499a0;
            --meta-color: rgba(255, 255, 255, 0.4);
        }
        body { margin: 0; padding: 30px; background: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 750px; }
        .container { background: var(--bg-color); border-radius: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; font-size: 20px; font-weight: bold; }
        .comment-item { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--item-border-color); padding-bottom: 20px; }
        .avatar { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; margin-right: 14px; object-fit: cover; }
        .comment-body { flex: 1; min-width: 0; }
        .username, .reply-username { display: inline-flex; align-items: center; gap: 6px; color: var(--username-color); font-weight: bold; }
        .username.is-up, .reply-username.is-up { color: #ff6699; }
        .level-badge, .up-badge { color: #fff; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
        .up-badge { border: 1px solid #ff6699; color: #ff6699; }
        .comment-text { margin-bottom: 8px; color: var(--text-color); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
        .comment-mention { color: #ff6699; font-weight: 600; }
        .comment-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .comment-image { max-width: 200px; max-height: 200px; border-radius: 4px; object-fit: contain; }
        .comment-sticker { max-width: 120px; max-height: 120px; margin-top: 8px; object-fit: contain; }
        .comment-emoji { width: 32px; height: 32px; object-fit: contain; }
        .comment-emoji-inline { width: 22px; height: 22px; vertical-align: middle; margin: 0 3px; display: inline-block; }
        .comment-footer { display: flex; gap: 15px; margin-top: 8px; color: var(--meta-color); font-size: 13px; }
        .replies { margin-top: 12px; padding: 12px; background: var(--reply-bg); border-radius: 8px; }
        .reply-item { display: flex; margin-bottom: 12px; }
        .reply-item:last-child { margin-bottom: 0; }
        .reply-avatar { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
        .reply-body { flex: 1; min-width: 0; }
        .reply-text { color: var(--text-color); font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
        .reply-footer { display: flex; gap: 12px; margin-top: 4px; color: var(--meta-color); font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>💬 《{{title}}》热门评论</span>
            <span style="font-size: 14px; color: var(--meta-color);">共 {{total_comments}} 条</span>
        </div>
        <div class="comments-list">{{comments}}</div>
    </div>
</body>
</html>
