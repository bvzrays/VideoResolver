<!DOCTYPE html>
<html class="{{theme_class}}">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-color: #161823;
            --text-color: #f1f1f1;
            --border-color: #2f303c;
            --username-color: rgba(255, 255, 255, 0.7);
            --meta-color: rgba(255, 255, 255, 0.4);
            --reply-border: #2f303c;
            --reply-text-color: #e1e1e1;
            --reply-user-color: rgba(255, 255, 255, 0.6);
        }
        html.light {
            --bg-color: #ffffff;
            --text-color: #18191c;
            --border-color: #e3e8ec;
            --username-color: rgba(0, 0, 0, 0.7);
            --meta-color: rgba(0, 0, 0, 0.4);
            --reply-border: #e3e8ec;
            --reply-text-color: #333333;
            --reply-user-color: rgba(0, 0, 0, 0.6);
        }
        body { margin: 0; padding: 30px; background: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 750px; }
        .container { background: var(--bg-color); border-radius: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; font-size: 20px; font-weight: bold; }
        .header .title { min-width: 0; max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .comment-item { display: flex; margin-bottom: 24px; }
        .avatar { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; margin-right: 14px; object-fit: cover; }
        .comment-body { flex: 1; min-width: 0; }
        .username, .reply-username { display: inline-flex; align-items: center; gap: 6px; color: var(--username-color); font-weight: 600; }
        .username { margin-bottom: 4px; }
        .badge-author { background: #ff2c55; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .comment-text { margin-bottom: 8px; color: var(--text-color); font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
        .comment-mention { color: #ff2c55; font-weight: 600; }
        .comment-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .comment-image { max-width: 240px; max-height: 240px; border: 1px solid var(--border-color); border-radius: 8px; object-fit: contain; }
        .comment-sticker { max-width: 120px; max-height: 120px; margin-top: 8px; object-fit: contain; }
        .comment-emoji { width: 32px; height: 32px; object-fit: contain; }
        .comment-footer { display: flex; gap: 15px; margin-top: 6px; color: var(--meta-color); font-size: 13px; }
        .replies { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--reply-border); }
        .reply-item { display: flex; margin-top: 12px; }
        .reply-avatar { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
        .reply-body { flex: 1; min-width: 0; }
        .reply-username { color: var(--reply-user-color); font-size: 13px; }
        .reply-text { color: var(--reply-text-color); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
        .reply-footer { display: flex; gap: 8px; margin-top: 4px; color: var(--meta-color); font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="title">💬 《{{title}}》热门评论</span>
            <span style="font-size: 14px; color: var(--meta-color);">共 {{total_comments}} 条</span>
        </div>
        <div class="comments-list">{{comments}}</div>
    </div>
</body>
</html>
